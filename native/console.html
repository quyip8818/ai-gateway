<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-gateway 控制台</title>
<style>
:root{font:15px system-ui,sans-serif;color:#172a2b;background:#edf1f0;--line:#d7e0dd;--primary:#075e55;--muted:#536967}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:7px;padding:.65rem .9rem;font-weight:600}button:disabled{opacity:.5;cursor:wait}.quiet{color:var(--primary);background:white;border-color:var(--line)}.layout{min-height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr)}aside{padding:1.75rem 1.15rem;background:#102c2a;color:white;display:flex;gap:2rem;flex-direction:column}nav{display:grid;gap:.4rem}nav button{background:transparent;border-color:transparent;text-align:left;font-weight:500}nav button:hover,nav .selected{background:#23504a}aside>.quiet{margin-top:auto}.brand{display:flex;align-items:center;gap:.7rem;font-weight:750;letter-spacing:.02em}.brand span{background:#bce4d7;color:#12302c;padding:.34rem .4rem;border-radius:6px;font-size:.76rem}.login{max-width:420px;margin:14vh auto}.login form,section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-top:1rem}.login form button{margin-top:.75rem}main{padding:1.75rem clamp(1.25rem,4vw,4rem);max-width:1600px;width:100%}header,.actions,.reveal{display:flex;align-items:center;gap:.7rem}header{justify-content:space-between}h1{font-size:1.9rem;margin:.25rem 0}h2{font-size:1.1rem;margin:0 0 1rem}h3{font-size:1rem}form,label,.fields{display:grid;gap:.55rem}form{gap:.9rem}form>button{justify-self:start}.fields{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}label,legend{font-size:.88rem;font-weight:600;color:#284643}input,textarea,select{border:1px solid var(--line);border-radius:6px;color:#102c2a;background:#fafdfc;padding:.58rem;min-width:0}textarea{min-height:5rem;resize:vertical}fieldset{border:1px solid var(--line);border-radius:7px}.check{display:flex;align-items:center;margin:.35rem}.feedback,.reveal{padding:.75rem;background:#e2f3ed;border-radius:7px}.reveal{margin-top:1rem;flex-wrap:wrap;overflow-wrap:anywhere}.oauth{margin-top:1.25rem;border-top:1px solid var(--line)}.table{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:.7rem .65rem;border-bottom:1px solid var(--line);white-space:nowrap}th,.empty{color:var(--muted)}td{font-size:.88rem}.empty{margin:.85rem .65rem 0}@media(max-width:710px){.layout{grid-template-columns:1fr}aside{gap:.8rem;padding:1rem}nav{display:flex;flex-wrap:wrap}aside>.quiet{align-self:start}header{align-items:start}.actions{flex-wrap:wrap}.login{margin:10vh auto}}
</style>
</head>
<body><div id="root"></div><script type="module" src="/console.js"></script></body>
</html>
