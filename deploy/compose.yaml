services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: native_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - native_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d native_gateway"]
      interval: 3s
      timeout: 2s
      retries: 15
  app:
    image: ${GATEWAY_IMAGE:-ai-gateway:local}
    build:
      context: ..
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD}@db:5432/native_gateway
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      JIMENG_BROWSER_TRANSPORT: ${JIMENG_BROWSER_TRANSPORT:-auto}
      CODEX_REDIRECT_URI: ${CODEX_REDIRECT_URI:-http://localhost:1455/auth/callback}
    volumes:
      - native_media:/data/media
    ports:
      - "${HTTP_HOST:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 15
    depends_on:
      db:
        condition: service_healthy
volumes:
  native_postgres:
  native_media:
