services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      timeout: 2s
      retries: 15
  app:
    image: ${GATEWAY_IMAGE:-ai-gateway:local}
    build:
      context: ..
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      KEY_DIGEST_SECRET: ${KEY_DIGEST_SECRET:?set KEY_DIGEST_SECRET}
      CONNECTION_SECRET: ${CONNECTION_SECRET:?set CONNECTION_SECRET}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      JIMENG_ACCOUNT_BASE_URL: ${JIMENG_ACCOUNT_BASE_URL:-}
      CODEX_ACCOUNT_BASE_URL: ${CODEX_ACCOUNT_BASE_URL:-}
      KIRO_ACCOUNT_BASE_URL: ${KIRO_ACCOUNT_BASE_URL:-}
      CLAUDE_ACCOUNT_BASE_URL: ${CLAUDE_ACCOUNT_BASE_URL:-}
      JIMENG_DOWNLOAD_HOSTS: ${JIMENG_DOWNLOAD_HOSTS:-}
      MEDIA_STORAGE_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app
volumes:
  postgres:
  media:
  caddy:
