name: gateway
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatewaytest
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: gatewaytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatewaytest -d gatewaytest"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci --prefix native
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://gatewaytest:test-password@127.0.0.1:5432/gatewaytest
      - run: docker build -t ai-gateway:ci .
